<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Helden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            background-color: #2b2d42;
            color: #fff;
        }

        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
        }
        .screen.active { display: flex; }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: #ffbe0b;
            text-shadow: 4px 4px 0px #000;
        }
        h2 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
        }

        /* MENÜ BUTONLARI */
        .btn-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-main {
            font-family: inherit;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 20px 40px;
            border: 4px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            min-width: 200px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .btn-main:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }
        .btn-blue   { background-color: #4cc9f0; }
        .btn-red    { background-color: #f72585; }
        .btn-green  { background-color: #4895ef; }
        .btn-yellow { background-color: #7209b7; }
        .btn-desc {
            font-size: 1rem;
            font-weight: normal;
            opacity: 0.92;
            line-height: 1.4;
        }

        /* OYUN EKRANI */
        #game-screen {
            padding: 0;
            flex-direction: row;
            gap: 0;
        }

        .player-area {
            flex: 1;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-right: 4px solid rgba(255,255,255,0.35);
            position: relative;
        }
        .player-area:last-child { border-right: none; }

        /* YANLIŞ CEVAP FLASH — overlay yöntemi (CSS inherit animasyonda çalışmaz) */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: #e63946;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }
        .flash-overlay.bang {
            animation: flashBang 0.45s ease forwards;
        }
        @keyframes flashBang {
            0%   { opacity: 0;   }
            25%  { opacity: 0.65; }
            100% { opacity: 0;   }
        }

        .p1-bg { background-color: #2a9d8f; }
        .p2-bg { background-color: #e76f51; }
        .p3-bg { background-color: #9b5de5; }
        .p4-bg { background-color: #f4a261; }

        .player-header { width: 100%; text-align: center; }
        .player-title {
            /* clamp: min 1.1rem, gewünschter Wert 2.5vw, max 2rem */
            font-size: clamp(1.1rem, 2.5vw, 2rem);
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.4);
            margin: 0;
        }
        .question-count {
            font-size: clamp(0.65rem, 1.2vw, 1rem);
            background: rgba(0,0,0,0.22);
            padding: 3px 10px;
            border-radius: 12px;
            margin-top: 3px;
            display: inline-block;
        }

        /* SEVİMLİ BALONLAR */
        .balloon-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            width: 100%;
            gap: 3px;
            padding: 4px 0;
        }

        .balloon {
            width:  clamp(22px, 3.8vw, 42px);
            height: clamp(28px, 4.8vw, 52px);
            border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
            position: relative;
            display: inline-block;
            margin: 2px;
            animation: float 2.6s ease-in-out infinite alternate;
            /* İç gölge + simüle yüzey */
            box-shadow: inset -5px -5px 0px rgba(0,0,0,0.10),
                        inset  4px  4px 6px rgba(255,255,255,0.30);
        }

        /* Her balon biraz farklı ritimde sallansın — canlı görünüm */
        .balloon:nth-child(odd)  { animation-duration: 2.3s; animation-delay: -0.6s; }
        .balloon:nth-child(even) { animation-duration: 3.1s; animation-delay: -1.3s; }
        .balloon:nth-child(3n)   { animation-duration: 2.8s; animation-delay: -0.9s; }

        /* Radial gradient ile hacimli balon görünümü */
        .p1-bg .balloon { background: radial-gradient(circle at 35% 32%, #ff9f9f 0%, #FF2525 80%); }
        .p2-bg .balloon { background: radial-gradient(circle at 35% 32%, #93e0f8 0%, #0D99D4 80%); }
        .p3-bg .balloon { background: radial-gradient(circle at 35% 32%, #d4aaff 0%, #7B2FBE 80%); }
        .p4-bg .balloon { background: radial-gradient(circle at 35% 32%, #ffe680 0%, #F09000 80%); }

        /* Balon ipi */
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 1.5px;
            height: 10px;
            background: rgba(255,255,255,0.65);
        }
        /* Parlak nokta */
        .balloon::before {
            content: '';
            position: absolute;
            top: 18%;
            left: 20%;
            width: 28%;
            height: 28%;
            background: rgba(255,255,255,0.72);
            border-radius: 50%;
        }

        @keyframes float {
            from { transform: translateY(0)   rotate(-3deg); }
            to   { transform: translateY(-8px) rotate( 3deg); }
        }

        /* PATLAMA — belirgin animasyon */
        @keyframes pop {
            0%   { transform: scale(1);   opacity: 1;   }
            20%  { transform: scale(2.0); opacity: 1;   }
            55%  { transform: scale(0.2); opacity: 0.6; }
            100% { transform: scale(0);   opacity: 0;   }
        }
        .balloon.popping {
            animation: pop 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards !important;
            pointer-events: none;
        }

        /* Patlama parçacıkları (JS ile oluşturulur) */
        .particle {
            position: fixed;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: flyOut 0.55s ease-out forwards;
        }
        @keyframes flyOut {
            0%   { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
        }

        /* SORU + CEVAP */
        .question-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .question-text {
            font-size: clamp(1.6rem, 3.2vw, 3.8rem);
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            margin: 0;
            white-space: nowrap;
        }
        .answer-input {
            font-family: inherit;
            font-size: clamp(1.4rem, 2.3vw, 2.8rem);
            font-weight: bold;
            width: 80%;
            max-width: 200px;
            height: clamp(38px, 6vh, 60px);
            text-align: center;
            background: rgba(255,255,255,0.92);
            color: #1d3557;
            border: 4px solid #fff;
            border-radius: 15px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .answer-input.empty { color: #aaa; }

        /* 3×4 KEYPAD */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(4px, 0.7vw, 8px);
            width: 100%;
            max-width: 235px;
            margin-bottom: 4px;
        }
        .key-btn {
            font-family: inherit;
            font-size: clamp(1.1rem, 1.9vw, 2.2rem);
            font-weight: bold;
            height: clamp(38px, 6.5vh, 58px);
            border: none;
            border-radius: 12px;
            background: #fff;
            color: #2b2d42;
            cursor: pointer;
            box-shadow: 0 5px 0 #b0b0b0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .key-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b0b0b0;
        }
        .key-btn.backspace {
            background-color: #ffb703;
            color: #000;
            box-shadow: 0 5px 0 #d4920a;
        }
        .key-btn.submit {
            background-color: #52b788;
            color: #fff;
            box-shadow: 0 5px 0 #2d8a62;
            font-size: clamp(1.3rem, 2vw, 2.4rem);
        }

        /* SONUÇ EKRANI */
        .floating-balloon {
            position: absolute;
            bottom: -90px;
            border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
            animation: riseUp 4.5s ease-in forwards;
        }
        @keyframes riseUp {
            0%   { transform: translateY(0)    translateX(0)    rotate(-3deg); opacity: 1; }
            40%  { transform: translateY(-40vh) translateX(18px) rotate( 4deg); }
            70%  { transform: translateY(-75vh) translateX(-12px)rotate(-2deg); }
            100% { transform: translateY(-115vh) translateX(6px);               opacity: 0; }
        }

        .leaderboard {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 320px;
        }
        .leaderboard-item {
            font-size: 2rem;
            display: flex;
            justify-content: space-between;
            gap: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- EKRAN 1: İŞLEM SEÇİMİ -->
    <div id="screen-1" class="screen active">
        <h1>Mathe-Helden 🚀</h1>
        <h2>Wähle eine Rechenart:</h2>
        <div class="btn-grid">
            <button class="btn-main btn-blue"   onclick="selectOperation('+')">➕<br>Addition</button>
            <button class="btn-main btn-red"    onclick="selectOperation('-')">➖<br>Subtraktion</button>
            <button class="btn-main btn-green"  onclick="selectOperation('*')">✖<br>Multiplikation</button>
            <button class="btn-main btn-yellow" onclick="selectOperation('/')">÷<br>Division</button>
        </div>
    </div>

    <!-- EKRAN 2: ZORLUK SEÇİMİ -->
    <div id="screen-2" class="screen">
        <h2>Wähle die Schwierigkeit:</h2>
        <div class="btn-grid">
            <button class="btn-main btn-blue" onclick="selectDifficulty('easy')">
                ⭐ Einfach
                <span class="btn-desc">Ergebnis max. 20<br>Kein Zehnerübergang</span>
            </button>
            <button class="btn-main btn-green" onclick="selectDifficulty('medium')">
                ⭐⭐ Mittel
                <span class="btn-desc">Ergebnis max. 100<br>Kein Zehnerübergang</span>
            </button>
            <button class="btn-main btn-red" onclick="selectDifficulty('hard')">
                ⭐⭐⭐ Schwer
                <span class="btn-desc">Zahlen 1–100<br>Mit Zehnerübergang</span>
            </button>
        </div>
    </div>

    <!-- EKRAN 3: OYUNCU SAYISI -->
    <div id="screen-3" class="screen">
        <h2>Wie viele Spieler?</h2>
        <div class="btn-grid">
            <button class="btn-main btn-blue"   onclick="startGame(2)">🦁🐯<br>2 Spieler</button>
            <button class="btn-main btn-green"  onclick="startGame(3)">🦁🐯🐸<br>3 Spieler</button>
            <button class="btn-main btn-yellow" onclick="startGame(4)">🦁🐯🐸🦊<br>4 Spieler</button>
        </div>
    </div>

    <!-- OYUN EKRANI -->
    <div id="game-screen" class="screen"></div>

    <!-- SONUÇ EKRANI -->
    <div id="result-screen" class="screen">
        <h1>Spiel zu Ende! 🎉</h1>
        <div id="leaderboard" class="leaderboard"></div>
        <button class="btn-main btn-green" onclick="resetGame()" style="margin-top:20px;">🔄 Nochmal spielen</button>
    </div>

    <script>
        /* ─── SABITLER VE DURUM ─── */
        let gameConfig = { operation: '+', difficulty: 'easy', playerCount: 2 };
        let players    = [];
        const MAX_QUESTIONS   = 15;
        const START_BALLOONS  = 10;
        const BALLOON_COLORS  = ['#FF2525', '#0D99D4', '#7B2FBE', '#F09000'];
        const PLAYER_ICONS    = ['🦁', '🐯', '🐸', '🦊'];

        /* ─── SES (Web Audio, internetsiz çalışır) ─── */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'pop') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.22);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.22);
                osc.start(); osc.stop(audioCtx.currentTime + 0.22);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.18);
                osc.start(); osc.stop(audioCtx.currentTime + 0.18);
            }
        }

        /* ─── EKRAN GEÇİŞLERİ ─── */
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function selectOperation(op)   { gameConfig.operation  = op;   showScreen('screen-2'); }
        function selectDifficulty(diff){ gameConfig.difficulty = diff;  showScreen('screen-3'); }

        /* ─── SORU ÜRETİMİ ─── */
        function generateQuestion() {
            let num1, num2, ans, valid = false;
            const op   = gameConfig.operation;
            const diff = gameConfig.difficulty;

            while (!valid) {
                if (diff === 'easy') {
                    // Kolay: max 20, Zehnerübergang yok
                    if (op === '+') {
                        num1 = Math.floor(Math.random() * 14) + 1;
                        num2 = Math.floor(Math.random() * (19 - num1)) + 1;
                        if ((num1 % 10) + (num2 % 10) < 10 && num1 + num2 <= 20) valid = true;
                    } else if (op === '-') {
                        num1 = Math.floor(Math.random() * 19) + 2;
                        num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
                        if ((num1 % 10) >= (num2 % 10) && num2 < num1) valid = true;
                    } else if (op === '*') {
                        num1 = Math.floor(Math.random() * 5) + 1;
                        num2 = Math.floor(Math.random() * 4) + 1;
                        valid = true;
                    } else {
                        num2 = Math.floor(Math.random() * 4) + 1;
                        ans  = Math.floor(Math.random() * 5) + 1;
                        num1 = num2 * ans;
                        valid = true;
                    }

                } else if (diff === 'medium') {
                    // Orta: max 100, Zehnerübergang yok
                    if (op === '+') {
                        num1 = Math.floor(Math.random() * 80) + 10;
                        num2 = Math.floor(Math.random() * 80) + 10;
                        if (num1 + num2 <= 99 &&
                            (num1 % 10) + (num2 % 10) <= 9 &&
                            Math.floor(num1 / 10) + Math.floor(num2 / 10) <= 9) valid = true;
                    } else if (op === '-') {
                        num1 = Math.floor(Math.random() * 80) + 19;
                        num2 = Math.floor(Math.random() * (num1 - 10)) + 10;
                        // Birler basamağında borç alma olmasın
                        if (num2 < num1 && (num1 % 10) >= (num2 % 10)) valid = true;
                    } else if (op === '*') {
                        num1 = Math.floor(Math.random() * 10) + 1;
                        num2 = Math.floor(Math.random() * 10) + 1;
                        valid = true;
                    } else {
                        num2 = Math.floor(Math.random() * 9) + 2;
                        ans  = Math.floor(Math.random() * 10) + 1;
                        num1 = num2 * ans;
                        valid = true;
                    }

                } else {
                    // Zor: 1-100 arası, tüm işlemler serbest, sonuç ≤ 100
                    if (op === '+') {
                        num1 = Math.floor(Math.random() * 89) + 10;
                        num2 = Math.floor(Math.random() * (100 - num1)) + 1;
                        if (num1 + num2 <= 100) valid = true;
                    } else if (op === '-') {
                        num1 = Math.floor(Math.random() * 88) + 12;
                        num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
                        valid = true;
                    } else if (op === '*') {
                        // Çarpım ≤ 100 olsun
                        num1 = Math.floor(Math.random() * 9) + 2;
                        num2 = Math.floor(Math.random() * Math.floor(100 / num1)) + 1;
                        if (num1 * num2 <= 100) valid = true;
                    } else {
                        num2 = Math.floor(Math.random() * 9) + 2;
                        ans  = Math.floor(Math.random() * Math.floor(100 / num2)) + 1;
                        num1 = num2 * ans;
                        valid = true;
                    }
                }
            }

            const sym = op === '*' ? '×' : op === '/' ? '÷' : op;
            const answer = op === '/' ? num1 / num2 : eval(`${num1} ${op} ${num2}`);
            return { text: `${num1} ${sym} ${num2}`, answer };
        }

        /* ─── OYUNU BAŞLATMA ─── */
        function startGame(count) {
            gameConfig.playerCount = count;
            players = [];
            const gameArea = document.getElementById('game-screen');
            gameArea.innerHTML = '';

            for (let i = 0; i < count; i++) {
                players.push({
                    id: i + 1,
                    balloons: START_BALLOONS,
                    questionIndex: 1,
                    correctCount: 0,
                    currentAnswer: '',
                    question: generateQuestion(),
                    finished: false
                });

                // Balon HTML (her biri ayrı ID ile — patlama hedefi)
                let balloonHTML = '';
                for (let b = 0; b < START_BALLOONS; b++) {
                    balloonHTML += `<div class="balloon" id="bl-${i}-${b}"></div>`;
                }

                const pDiv = document.createElement('div');
                pDiv.className = `player-area p${i+1}-bg`;
                pDiv.id = `player-area-${i}`;
                pDiv.innerHTML = `
                    <div class="flash-overlay" id="flash-${i}"></div>

                    <div class="player-header">
                        <div class="player-title">${PLAYER_ICONS[i]} Spieler ${i+1}</div>
                        <div class="question-count" id="q-count-${i}">Aufgabe 1 / ${MAX_QUESTIONS}</div>
                    </div>

                    <div class="balloon-container" id="balloons-${i}">${balloonHTML}</div>

                    <div class="question-box">
                        <div class="question-text" id="q-text-${i}">${players[i].question.text} = ?</div>
                        <div class="answer-input empty" id="ans-${i}">_</div>
                    </div>

                    <div class="keypad">
                        <button class="key-btn" onclick="pressKey(${i},'1')">1</button>
                        <button class="key-btn" onclick="pressKey(${i},'2')">2</button>
                        <button class="key-btn" onclick="pressKey(${i},'3')">3</button>
                        <button class="key-btn" onclick="pressKey(${i},'4')">4</button>
                        <button class="key-btn" onclick="pressKey(${i},'5')">5</button>
                        <button class="key-btn" onclick="pressKey(${i},'6')">6</button>
                        <button class="key-btn" onclick="pressKey(${i},'7')">7</button>
                        <button class="key-btn" onclick="pressKey(${i},'8')">8</button>
                        <button class="key-btn" onclick="pressKey(${i},'9')">9</button>
                        <button class="key-btn backspace" onclick="pressKey(${i},'back')">⌫</button>
                        <button class="key-btn" onclick="pressKey(${i},'0')">0</button>
                        <button class="key-btn submit"    onclick="pressKey(${i},'ok')">✓</button>
                    </div>
                `;
                gameArea.appendChild(pDiv);
            }
            showScreen('game-screen');
        }

        /* ─── KEYPAD ─── */
        function pressKey(pIdx, key) {
            const p = players[pIdx];
            if (p.finished) return;
            const display = document.getElementById(`ans-${pIdx}`);

            if (key === 'back') {
                p.currentAnswer = p.currentAnswer.slice(0, -1);
            } else if (key === 'ok') {
                if (p.currentAnswer !== '') checkAnswer(pIdx);
                return;
            } else {
                if (p.currentAnswer.length < 4) p.currentAnswer += key;
            }

            if (p.currentAnswer === '') {
                display.innerText = '_';
                display.classList.add('empty');
            } else {
                display.innerText = p.currentAnswer;
                display.classList.remove('empty');
            }
        }

        /* ─── PATLAMA PARÇACIKLARİ ─── */
        function spawnParticles(balloonEl, playerIdx) {
            const rect  = balloonEl.getBoundingClientRect();
            const cx    = rect.left + rect.width  / 2;
            const cy    = rect.top  + rect.height / 2;
            const color = BALLOON_COLORS[playerIdx];
            const count = 12;

            for (let i = 0; i < count; i++) {
                const angle = (360 / count) * i + Math.random() * 15;
                const dist  = 45 + Math.random() * 40;
                const tx = Math.cos(angle * Math.PI / 180) * dist;
                const ty = Math.sin(angle * Math.PI / 180) * dist;

                const dot = document.createElement('div');
                dot.className = 'particle';
                dot.style.cssText = `
                    left: ${cx}px; top: ${cy}px;
                    background: ${color};
                    --tx: ${tx}px; --ty: ${ty}px;
                `;
                document.body.appendChild(dot);
                setTimeout(() => dot.remove(), 600);
            }
        }

        /* ─── CEVAP KONTROLÜ ─── */
        function checkAnswer(pIdx) {
            const p       = players[pIdx];
            const entered = parseInt(p.currentAnswer, 10);
            const correct = Math.round(p.question.answer);

            if (entered === correct) {
                // ✅ DOĞRU
                playSound('correct');
                p.correctCount++;
                p.questionIndex++;
                if (p.questionIndex > MAX_QUESTIONS) { finishPlayer(pIdx); return; }
                p.question = generateQuestion();
                document.getElementById(`q-text-${pIdx}`).innerText = `${p.question.text} = ?`;
                document.getElementById(`q-count-${pIdx}`).innerText = `Aufgabe ${p.questionIndex} / ${MAX_QUESTIONS}`;

            } else {
                // ❌ YANLIŞ — balon patlat
                playSound('pop');

                const currentBalloonIdx = p.balloons - 1;  // en sağdaki (sonradan eklenmiş) balon
                const balloonEl = document.getElementById(`bl-${pIdx}-${currentBalloonIdx}`);
                if (balloonEl && !balloonEl.classList.contains('popping')) {
                    spawnParticles(balloonEl, pIdx);
                    balloonEl.classList.add('popping');
                    setTimeout(() => { if (balloonEl) balloonEl.style.visibility = 'hidden'; }, 500);
                }

                // Kırmızı flaş (overlay yöntemi)
                const flashEl = document.getElementById(`flash-${pIdx}`);
                flashEl.classList.remove('bang');
                void flashEl.offsetWidth;    // reflow — animasyon yeniden tetiklenmesi için
                flashEl.classList.add('bang');

                p.balloons--;
                if (p.balloons <= 0) { finishPlayer(pIdx); return; }
            }

            p.currentAnswer = '';
            const display = document.getElementById(`ans-${pIdx}`);
            display.innerText = '_';
            display.classList.add('empty');
        }

        /* ─── OYUNCU BİTİŞİ ─── */
        function finishPlayer(pIdx) {
            players[pIdx].finished = true;
            const pArea = document.getElementById(`player-area-${pIdx}`);
            pArea.style.opacity       = '0.5';
            pArea.style.pointerEvents = 'none';
            if (players.every(p => p.finished)) setTimeout(showResults, 1000);
        }

        /* ─── SONUÇ EKRANI ─── */
        function showResults() {
            showScreen('result-screen');
            playVictoryMusic();
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = '';
            // Kazanan başlığı güncelle
            const sorted0 = [...players].sort((a, b) =>
                b.correctCount !== a.correctCount ? b.correctCount - a.correctCount : b.balloons - a.balloons
            );
            const winner = sorted0[0];
            document.querySelector('#result-screen h1').innerHTML =
                `${PLAYER_ICONS[winner.id-1]} Spieler ${winner.id} gewinnt! 🎉`;

            const medals = ['🥇', '🥈', '🥉', '4️⃣'];
            // Sıralama: önce doğru sayısı (çok = iyi), eşitse kalan balon
            const sorted = [...players].sort((a, b) =>
                b.correctCount !== a.correctCount
                    ? b.correctCount - a.correctCount
                    : b.balloons - a.balloons
            );

            sorted.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `
                    <span>${medals[idx]} ${PLAYER_ICONS[p.id-1]} Spieler ${p.id}</span>
                    <span>✅ ${p.correctCount} / ${MAX_QUESTIONS} &nbsp; 🎈 ${p.balloons}</span>
                `;
                lb.appendChild(item);

                // Kurtarılan balonlar yukarı süzülsün
                for (let b = 0; b < p.balloons; b++) {
                    const fb   = document.createElement('div');
                    fb.className = 'floating-balloon';
                    const sz   = 38 + Math.random() * 22;
                    fb.style.cssText = `
                        left: ${5 + Math.random() * 90}%;
                        width: ${sz}px; height: ${sz * 1.28}px;
                        background: radial-gradient(circle at 35% 32%, ${lighten(BALLOON_COLORS[p.id-1])} 0%, ${BALLOON_COLORS[p.id-1]} 80%);
                        animation-delay: ${Math.random() * 3}s;
                    `;
                    document.getElementById('result-screen').appendChild(fb);
                }
            });
        }

        /* Balon gradyanı için basit açık renk üretici */
        function lighten(hex) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            const mix = v => Math.min(255, v + 90);
            return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
        }

        /* ─── ZAFer MÜZİĞİ (Web Audio — internetsiz) ─── */
        let victoryNodes = [];

        function stopVictoryMusic() {
            victoryNodes.forEach(n => { try { n.stop(0); } catch(e){} });
            victoryNodes = [];
        }

        function playVictoryMusic() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopVictoryMusic();

            const master = audioCtx.createGain();
            master.gain.value = 0.42;
            master.connect(audioCtx.destination);

            // Tek bir nota çal — osc + zarf
            function note(freq, start, dur, type = 'triangle', vol = 0.75) {
                const osc = audioCtx.createOscillator();
                const g   = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(g);
                g.connect(master);
                const t0 = audioCtx.currentTime + start;
                g.gain.setValueAtTime(0, t0);
                g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
                g.gain.setValueAtTime(vol * 0.75, t0 + dur * 0.65);
                g.gain.linearRampToValueAtTime(0, t0 + dur);
                osc.start(t0);
                osc.stop(t0 + dur + 0.08);
                victoryNodes.push(osc);
            }

            // Davul / vurmalı ses (noise burst)
            function drum(start, vol = 0.28) {
                const sr  = audioCtx.sampleRate;
                const buf = audioCtx.createBuffer(1, Math.ceil(sr * 0.18), sr);
                const d   = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++)
                    d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.035));
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                const g   = audioCtx.createGain();
                g.gain.value = vol;
                src.connect(g);
                g.connect(master);
                src.start(audioCtx.currentTime + start);
                victoryNodes.push(src);
            }

            // ── Melodi: hızlı tırmanış → zafer fanfarı ──
            // Kısa hızlı koşu (C5→E5→G5→C6)
            note(523, 0.00, 0.10);   // C5
            note(659, 0.09, 0.10);   // E5
            note(784, 0.18, 0.10);   // G5
            note(1047,0.27, 0.35);   // C6 — uzun!

            // Kısa nefes
            note(784, 0.65, 0.12);   // G5
            note(880, 0.77, 0.12);   // A5
            note(1047,0.89, 0.50);   // C6 — zafer notası

            // Parıltılı iniş
            note(1319,1.42, 0.09);   // E6
            note(1175,1.51, 0.09);   // D6
            note(1047,1.60, 0.09);   // C6
            note(880, 1.69, 0.09);   // A5
            note(1047,1.78, 0.80);   // C6 — büyük final

            // ── Armoni (sine, daha yumuşak) ──
            note(261, 0.00, 0.40, 'sine', 0.30);  // C4 bas
            note(392, 0.65, 0.78, 'sine', 0.28);  // G4 bas
            note(523, 1.78, 0.80, 'sine', 0.30);  // C5

            // ── Vurmalı ──
            drum(0.00); drum(0.27); drum(0.65); drum(0.89); drum(1.42); drum(1.78);

            // ── Çarpıcı sparkle (yüksek frekans titreşim) ──
            for (let i = 0; i < 6; i++) {
                const t = 1.85 + i * 0.065;
                const f = 2093 - i * 110;          // C7 den aşağı
                note(f, t, 0.12, 'sine', 0.18);
            }
        }

        /* ─── YENİDEN OYNA ─── */
        function resetGame() {
            stopVictoryMusic();
            document.querySelectorAll('.floating-balloon').forEach(e => e.remove());
            showScreen('screen-1');
        }
    </script>
