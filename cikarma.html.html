<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çıkarma Yarışı - Akıllı Tahta</title>
    <style>
        :root {
            --bg: #FDFEFE;
            --p1: #FF5252; --p2: #2196F3; --p3: #4CAF50; --p4: #FFC107;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #2196F3; /* Mavi arka plan */
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            user-select: none; touch-action: manipulation;
        }

        #setup-screen {
            position: fixed; inset: 0; background: #E3F2FD; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .mode-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .player-select-btn {
            width: 180px; height: 120px; font-size: 3rem; cursor: pointer;
            border-radius: 25px; border: 6px solid #1976D2; background: white;
            font-weight: bold; box-shadow: 0 8px 0 #0D47A1;
        }

        #game-area { display: flex; flex: 1; width: 100%; height: 100%; background: white; }

        .player-lane {
            flex: 1; display: flex; flex-direction: column;
            border-right: 3px solid #333; position: relative;
            background: white; padding: 5px;
        }

        .header { background: #333; color: white; padding: 8px; font-size: 1.2rem; text-align: center; }
        .question { font-size: 3rem; margin: 25px 0; text-align: center; font-weight: bold; color: #333; min-height: 90px; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; padding: 0 5px; }
        
        .btn {
            width: 100%; padding: 18px 0; font-size: 2.2rem; border-radius: 15px;
            border: 3px solid #ccc; background: white; cursor: pointer;
            font-weight: bold; box-shadow: 0 5px 0 #bbb;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #bbb; }

        .lane-1 { background-color: #fff5f5; } .lane-2 { background-color: #f0f7ff; }
        .lane-3 { background-color: #f2fff2; } .lane-4 { background-color: #fffff0; }

        .correct { background: #4CAF50 !important; color: white; border-color: #1b5e20; }
        .wrong { background: #F44336 !important; color: white; border-color: #b71c1c; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .winner-overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 500; border: 10px solid #2196F3; text-align: center;
        }

        #restart-area { position: fixed; top: 10px; right: 10px; z-index: 2000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1 style="font-size: 3.5rem; color: #1565C0; margin-bottom: 20px;">➖ ÇIKARMA YARIŞI</h1>
        <div class="mode-container">
            <button class="player-select-btn" onclick="initGame(1)">1</button>
            <button class="player-select-btn" onclick="initGame(2)">2</button>
            <button class="player-select-btn" onclick="initGame(3)">3</button>
            <button class="player-select-btn" onclick="initGame(4)">4</button>
        </div>
        <p style="margin-top: 20px; font-weight: bold; color: #1976D2;">Eksileni Bul, Yarışı Kazan!</p>
    </div>

    <div id="game-area" class="hidden"></div>

    <div id="restart-area" class="hidden">
        <button class="btn" style="background: #2196F3; color: white; padding: 10px 20px; font-size: 1.2rem; box-shadow: 0 4px 0 #0D47A1;" onclick="location.reload()">🔄 SIFIRLA</button>
    </div>

<script>
    const subtractionBank = [
        // Level 1
        { q: "9 - 4", a: 5, opts: [4,5,6,7] },
        { q: "13 - 5", a: 8, opts: [7,8,9,10] },
        { q: "11 - 3", a: 8, opts: [7,8,9,10] },
        { q: "17 - 6", a: 11, opts: [10,11,12,13] },
        { q: "14 - 7", a: 7, opts: [6,7,8,9] },
        // Level 2
        { q: "18 - 9", a: 9, opts: [8,9,10,11] },
        { q: "16 - 8", a: 8, opts: [7,8,9,10] },
        { q: "19 - 7", a: 12, opts: [11,12,13,14] },
        { q: "23 - 6", a: 17, opts: [16,17,18,19] },
        { q: "26 - 8", a: 18, opts: [17,18,19,20] },
        // Level 3
        { q: "29 - 9", a: 20, opts: [19,20,21,22] },
        { q: "32 - 7", a: 25, opts: [24,25,26,27] },
        { q: "35 - 8", a: 27, opts: [26,27,28,29] },
        { q: "41 - 9", a: 32, opts: [31,32,33,34] },
        { q: "44 - 6", a: 38, opts: [37,38,39,40] },
        // Level 4
        { q: "48 - 9", a: 39, opts: [38,39,40,41] },
        { q: "52 - 8", a: 44, opts: [43,44,45,46] },
        { q: "57 - 9", a: 48, opts: [47,48,49,50] },
        { q: "63 - 7", a: 56, opts: [55,56,57,58] },
        { q: "68 - 9", a: 59, opts: [58,59,60,61] }
    ];

    let players = [];
    let audioCtx;

    function initGame(count) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        document.getElementById('setup-screen').classList.add('hidden');
        const area = document.getElementById('game-area');
        area.classList.remove('hidden');
        area.innerHTML = '';
        
        for(let i=1; i<=count; i++) {
            let shuffledQuestions = JSON.parse(JSON.stringify(subtractionBank)).sort(() => Math.random() - 0.5);
            players.push({ id: i, qList: shuffledQuestions });

            const lane = document.createElement('div');
            lane.className = `player-lane lane-${i}`;
            lane.id = `lane-${i}`;
            lane.innerHTML = `
                <div class="header">OYUNCU ${i}</div>
                <div class="question" id="p${i}-q">...</div>
                <div class="options-grid" id="p${i}-opts"></div>
            `;
            area.appendChild(lane);
            renderQuestion(i);
        }
    }

    function renderQuestion(pId) {
        const p = players[pId-1];
        if(!p || p.qList.length === 0) return win(pId);

        const data = p.qList[0];
        document.getElementById(`p${pId}-q`).innerText = data.q + " = ?";
        const optsDiv = document.getElementById(`p${pId}-opts`);
        optsDiv.innerHTML = '';
        
        const shuffledOpts = [...data.opts].sort(() => Math.random() - 0.5);
        shuffledOpts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => check(pId, opt, data.a, btn);
            optsDiv.appendChild(btn);
        });
    }

    function check(pId, val, correct, btn) {
        const p = players[pId-1];
        if(val === correct) {
            btn.classList.add('correct');
            beep(600, 0.1);
            setTimeout(() => {
                p.qList.shift();
                renderQuestion(pId);
            }, 400);
        } else {
            btn.classList.add('wrong');
            beep(150, 0.2);
            setTimeout(() => {
                btn.classList.remove('wrong');
                const wrongQ = p.qList.shift();
                p.qList.push(wrongQ); 
                renderQuestion(pId);
            }, 600);
        }
    }

    function win(pId) {
        const lane = document.getElementById(`lane-${pId}`);
        if(!lane.querySelector('.winner-overlay')) {
            const overlay = document.createElement('div');
            overlay.className = 'winner-overlay';
            overlay.innerHTML = `<h1 style="font-size:3.5rem">🎯</h1><h3>SÜPERDİ!</h3><p>Oyuncu ${pId}<br>Hız Rekortmeni!</p>`;
            lane.appendChild(overlay);
            document.getElementById('restart-area').classList.remove('hidden');
        }
    }

    function beep(f, d) {
        if(!audioCtx) return;
        try {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.frequency.value = f;
            g.gain.value = 0.05;
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        } catch(e) {}
    }
</script>
</body>
</html>
