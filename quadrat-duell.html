<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadrat-Duell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --p1: #FF6B9D;
      --p2: #00C9A7;
      --bg: #1e1245;
      --border: rgba(255,255,255,0.18);
      --yellow: #FFD93D;
      --font: 'Fredoka', sans-serif;
    }
    * { box-sizing:border-box; user-select:none; -webkit-user-select:none;
        touch-action:manipulation; margin:0; padding:0; }
    html,body { width:100vw; height:100vh; overflow:hidden;
                font-family:var(--font); background:var(--bg); color:#fff; }

    .screen { width:100vw; height:100vh; display:none; position:relative; }
    .screen.active { display:flex; }

    /* ── MENU EKRANLAR ── */
    .menu-screen {
      flex-direction:column; justify-content:center; align-items:center;
      gap:clamp(1.5rem,3vh,3rem); text-align:center; padding:2rem;
      background:radial-gradient(ellipse at 50% 30%, #3a1a7a 0%, #1e1245 70%);
    }

    .game-title {
      font-size:clamp(4.5rem,9vw,8rem); font-weight:600;
      color:var(--yellow);
      text-shadow:0 4px 24px rgba(255,217,61,0.35), 4px 4px 0 rgba(0,0,0,0.3);
      letter-spacing:4px;
    }
    .game-subtitle { font-size:clamp(1.3rem,2.5vw,2.2rem); opacity:0.8; font-weight:400; }
    .monsters-hero { font-size:clamp(3.5rem,7vw,6rem); display:flex; gap:2rem; align-items:center; }
    .vs-text { font-size:clamp(1.5rem,3vw,2.5rem); opacity:0.45; font-weight:400; }
    .menu-label { font-size:clamp(1.5rem,3vw,2.5rem); font-weight:500; opacity:0.9; }

    .btn-grid { display:flex; gap:clamp(1rem,2vw,2rem); justify-content:center; flex-wrap:wrap; }

    .btn-menu {
      font-family:inherit; font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:500;
      padding:clamp(1rem,2vh,1.8rem) clamp(1.4rem,2.5vw,2.2rem);
      border:2.5px solid rgba(255,255,255,0.25); border-radius:20px;
      background:rgba(255,255,255,0.08); color:#fff; cursor:pointer;
      box-shadow:0 6px 0 rgba(0,0,0,0.22);
      transition:transform 0.08s, box-shadow 0.08s;
      display:flex; flex-direction:column; align-items:center; gap:0.4rem; min-width:155px;
    }
    .btn-menu:active { transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,0.22); }
    .btn-menu .sub { font-size:clamp(0.8rem,1.4vw,1.1rem); font-weight:400; opacity:0.7; }

    .btn-start {
      font-family:inherit; font-size:clamp(1.8rem,3vw,2.6rem); font-weight:600;
      padding:clamp(1rem,2vh,1.6rem) clamp(3rem,5vw,5rem);
      border:3px solid rgba(255,255,255,0.4); border-radius:50px;
      background:linear-gradient(135deg,#9b59b6,#6c3483); color:#fff; cursor:pointer;
      box-shadow:0 6px 0 rgba(0,0,0,0.28);
      transition:transform 0.08s, box-shadow 0.08s;
    }
    .btn-start:active { transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,0.28); }

    /* Aksan renkleri */
    .op-plus   { border-color:#6bcb77; color:#c5f5ca; }
    .op-minus  { border-color:#ff6b6b; color:#ffcaca; }
    .op-mal    { border-color:#ffd740; color:#fff3c0; }
    .op-div    { border-color:#4ecdc4; color:#b8f5f2; }
    .op-mix    { border-color:#bb86fc; color:#e8d5ff; }
    .d-easy    { border-color:#69f0ae; color:#c0fff0; }
    .d-mid     { border-color:#ffd740; color:#fff3c0; }
    .d-hard    { border-color:#ff7070; color:#ffe0e0; }

    /* ── OYUN EKRANI ── */
    #game-screen { flex-direction:column; }

    .game-header {
      height:clamp(52px,9vh,78px); width:100%;
      display:flex; justify-content:space-between; align-items:center;
      padding:0 clamp(1rem,3vw,3rem);
      background:rgba(0,0,0,0.28); border-bottom:2px solid var(--border);
    }
    .player-score {
      font-size:clamp(1.6rem,3vw,2.6rem); font-weight:600;
      display:flex; align-items:center; gap:0.5rem;
    }
    .p1-col { color:var(--p1); } .p2-col { color:var(--p2); }

    .timer-display {
      font-size:clamp(2rem,3.5vw,3rem); font-weight:600;
      background:rgba(0,0,0,0.3); padding:0.2rem 1.2rem;
      border-radius:14px; border:2px solid var(--border);
      letter-spacing:2px; transition:color 0.3s;
    }
    .t-warn   { color:#FFD93D; animation:pulse 1s   infinite alternate; }
    .t-danger { color:#ff5555; animation:pulse 0.4s infinite alternate; }
    @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.1)} }

    /* Raster */
    .grid-container {
      height:clamp(115px,21vh,195px); width:100%;
      padding:clamp(6px,1.2vh,14px) clamp(1rem,2.5vw,2.5rem);
      display:grid; grid-template-columns:repeat(5,1fr);
      grid-template-rows:repeat(4,1fr); gap:clamp(5px,1vw,10px);
      background:linear-gradient(90deg,
        rgba(255,107,157,0.10) 0%, rgba(0,0,0,0.22) 50%, rgba(0,201,167,0.10) 100%);
      border-bottom:2px solid var(--border);
    }
    .square {
      border-radius:12px; border:2.5px solid rgba(255,255,255,0.22);
      transition:background 0.45s ease, transform 0.2s;
      position:relative; overflow:hidden;
    }
    /* Parlak nokta */
    .square::before {
      content:''; position:absolute; top:10%; left:13%;
      width:30%; height:30%; background:rgba(255,255,255,0.42);
      border-radius:50%; pointer-events:none;
    }
    .square.p1 {
      background:radial-gradient(circle at 35% 28%, #ffb8d4 0%, var(--p1) 80%);
      box-shadow:0 4px 12px rgba(255,107,157,0.38), inset 0 2px 4px rgba(255,255,255,0.18);
    }
    .square.p2 {
      background:radial-gradient(circle at 35% 28%, #80f0e0 0%, var(--p2) 80%);
      box-shadow:0 4px 12px rgba(0,201,167,0.38), inset 0 2px 4px rgba(255,255,255,0.18);
    }
    .square.captured { animation:capAnim 0.45s cubic-bezier(.36,.07,.19,.97); }
    @keyframes capAnim {
      0%  {transform:scale(1);    filter:brightness(1);}
      35% {transform:scale(1.35); filter:brightness(2.4);}
      70% {transform:scale(0.88); filter:brightness(1.2);}
      100%{transform:scale(1);    filter:brightness(1);}
    }

    /* Oyuncular */
    .players-container { flex:1; display:flex; width:100%; }
    .player-side {
      flex:1; height:100%; display:flex; flex-direction:column;
      justify-content:space-evenly; align-items:center;
      padding:0.5rem 1rem; position:relative;
    }
    .p1-side {
      border-right:2px solid var(--border);
      background:linear-gradient(160deg,rgba(255,107,157,.18) 0%,rgba(255,107,157,.04) 100%);
    }
    .p2-side {
      background:linear-gradient(160deg,rgba(0,201,167,.18) 0%,rgba(0,201,167,.04) 100%);
    }

    .question-text {
      font-size:clamp(2.2rem,4vw,3.8rem); font-weight:500;
      text-shadow:2px 2px 0 rgba(0,0,0,0.3); white-space:nowrap;
    }
    .answer-box {
      width:clamp(130px,18vw,215px); height:clamp(48px,7vh,70px);
      background:rgba(255,255,255,0.92); color:#1e1245;
      font-size:clamp(1.9rem,3.3vw,3rem); font-weight:500;
      border-radius:14px; display:flex; justify-content:center; align-items:center;
      border:3px solid rgba(255,255,255,0.8); box-shadow:inset 0 3px 7px rgba(0,0,0,0.12);
    }
    .answer-box.empty { color:#bbb; }

    .keypad {
      display:grid; grid-template-columns:repeat(3,1fr);
      gap:clamp(5px,0.9vh,10px); width:clamp(195px,27vw,310px);
    }
    .key-btn {
      font-family:inherit; font-size:clamp(1.5rem,2.6vw,2.3rem); font-weight:500;
      height:clamp(40px,6.5vh,60px); border:none; border-radius:12px;
      background:#fff; color:#1e1245; cursor:pointer;
      box-shadow:0 5px 0 #aaa;
      display:flex; justify-content:center; align-items:center;
      transition:transform 0.05s, box-shadow 0.05s;
    }
    .key-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #aaa; }
    .key-btn.back   { background:#FFD93D; color:#444; box-shadow:0 5px 0 #c9a800; }
    .key-btn.submit { background:#69f0ae; color:#1e1245; box-shadow:0 5px 0 #2dba72; }

    .flash-overlay {
      position:absolute; inset:0; pointer-events:none; opacity:0; z-index:20;
    }
    .flash-overlay.correct { animation:fG .4s ease-out; }
    .flash-overlay.wrong   { animation:fR .4s ease-out; }
    @keyframes fG {
      0%  {opacity:0;background:rgba(105,240,174,0);}
      30% {opacity:1;background:rgba(105,240,174,.36);}
      100%{opacity:0;background:rgba(105,240,174,0);}
    }
    @keyframes fR {
      0%  {opacity:0;background:rgba(255,107,107,0);}
      30% {opacity:1;background:rgba(255,107,107,.40);}
      100%{opacity:0;background:rgba(255,107,107,0);}
    }

    /* Sonuç */
    .result-stats {
      display:flex; gap:2rem; flex-wrap:wrap; justify-content:center;
      background:rgba(0,0,0,0.28); padding:1.2rem 2.5rem;
      border-radius:20px; border:2px solid var(--border);
    }
    .stat-box { display:flex; flex-direction:column; gap:0.4rem; min-width:120px; }
    .stat-label { font-size:clamp(1rem,1.8vw,1.5rem); opacity:0.82; font-weight:400; }
    .stat-value { font-size:clamp(2rem,3.5vw,3.2rem); font-weight:600; color:var(--yellow); }

    .winner-title {
      font-size:clamp(2.8rem,5.5vw,5rem); font-weight:600;
      text-shadow:3px 3px 0 rgba(0,0,0,0.35);
    }

    .confetti {
      position:absolute; width:11px; height:11px; border-radius:3px;
      pointer-events:none; animation:cFall 3s linear infinite;
    }
    @keyframes cFall {
      0%  {transform:translateY(-10vh) rotate(0deg);   opacity:1;}
      100%{transform:translateY(105vh) rotate(720deg); opacity:0;}
    }
  </style>
</head>
<body>

<!-- EKRAN 1: BAŞLIK -->
<div id="s1" class="screen menu-screen active">
  <div class="monsters-hero">🦖 <span class="vs-text">VS</span> 🦕</div>
  <div class="game-title">Quadrat-Duell</div>
  <div class="game-subtitle">Wer erobert das Spielfeld?</div>
  <button class="btn-start" onclick="showS('s2')">🎮 Spielen!</button>
</div>

<!-- EKRAN 2: İŞLEM SEÇİMİ -->
<div id="s2" class="screen menu-screen">
  <div class="menu-label">Wähle eine Rechenart:</div>
  <div class="btn-grid">
    <button class="btn-menu op-plus"  onclick="selOp('+')">➕ Addition<span class="sub">Plusrechnen</span></button>
    <button class="btn-menu op-minus" onclick="selOp('-')">➖ Subtraktion<span class="sub">Minusrechnen</span></button>
    <button class="btn-menu op-mal"   onclick="selOp('*')">✖ Multiplikation<span class="sub">Einmaleins</span></button>
    <button class="btn-menu op-div"   onclick="selOp('/')">÷ Division<span class="sub">Teilen</span></button>
    <button class="btn-menu op-mix"   onclick="selOp('mix')" style="min-width:210px;">🔀 Gemischt<span class="sub">Alle 4 Rechenarten</span></button>
  </div>
</div>

<!-- EKRAN 3: ZORLUK SEÇİMİ -->
<div id="s3" class="screen menu-screen">
  <div class="menu-label">Wähle die Schwierigkeit:</div>
  <div class="btn-grid">
    <button class="btn-menu d-easy" onclick="selDiff('easy')">
      ⭐ Einfach<span class="sub">Bis 20 · kein Zehnerübergang</span>
    </button>
    <button class="btn-menu d-mid" onclick="selDiff('medium')">
      ⭐⭐ Mittel<span class="sub">Zehnerzahlen · kein Übergang</span>
    </button>
    <button class="btn-menu d-hard" onclick="selDiff('hard')">
      ⭐⭐⭐ Schwer<span class="sub">Bis 100 · mit Zehnerübergang</span>
    </button>
  </div>
</div>

<!-- OYUN EKRANI -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <div class="player-score p1-col">🦖 <span id="p1-cnt">10</span></div>
    <div class="timer-display" id="timer">2:00</div>
    <div class="player-score p2-col"><span id="p2-cnt">10</span> 🦕</div>
  </div>

  <div class="grid-container" id="grid"></div>

  <div class="players-container">
    <div class="player-side p1-side" id="p1-side">
      <div class="flash-overlay" id="fl1"></div>
      <div class="question-text" id="q1">— = ?</div>
      <div class="answer-box empty" id="a1">_</div>
      <div class="keypad">
        <button class="key-btn" onclick="key(1,'1')">1</button>
        <button class="key-btn" onclick="key(1,'2')">2</button>
        <button class="key-btn" onclick="key(1,'3')">3</button>
        <button class="key-btn" onclick="key(1,'4')">4</button>
        <button class="key-btn" onclick="key(1,'5')">5</button>
        <button class="key-btn" onclick="key(1,'6')">6</button>
        <button class="key-btn" onclick="key(1,'7')">7</button>
        <button class="key-btn" onclick="key(1,'8')">8</button>
        <button class="key-btn" onclick="key(1,'9')">9</button>
        <button class="key-btn back"   onclick="key(1,'back')">⌫</button>
        <button class="key-btn" onclick="key(1,'0')">0</button>
        <button class="key-btn submit" onclick="key(1,'ok')">✓</button>
      </div>
    </div>

    <div class="player-side p2-side" id="p2-side">
      <div class="flash-overlay" id="fl2"></div>
      <div class="question-text" id="q2">— = ?</div>
      <div class="answer-box empty" id="a2">_</div>
      <div class="keypad">
        <button class="key-btn" onclick="key(2,'1')">1</button>
        <button class="key-btn" onclick="key(2,'2')">2</button>
        <button class="key-btn" onclick="key(2,'3')">3</button>
        <button class="key-btn" onclick="key(2,'4')">4</button>
        <button class="key-btn" onclick="key(2,'5')">5</button>
        <button class="key-btn" onclick="key(2,'6')">6</button>
        <button class="key-btn" onclick="key(2,'7')">7</button>
        <button class="key-btn" onclick="key(2,'8')">8</button>
        <button class="key-btn" onclick="key(2,'9')">9</button>
        <button class="key-btn back"   onclick="key(2,'back')">⌫</button>
        <button class="key-btn" onclick="key(2,'0')">0</button>
        <button class="key-btn submit" onclick="key(2,'ok')">✓</button>
      </div>
    </div>
  </div>
</div>

<!-- SONUÇ EKRANI -->
<div id="result-screen" class="screen menu-screen">
  <div class="winner-title" id="winner"></div>
  <div class="result-stats">
    <div class="stat-box">
      <div class="stat-label">🟦 Quadrate</div>
      <div class="stat-value" id="r-sq">— : —</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">✅ Richtige</div>
      <div class="stat-value" id="r-cor">— : —</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">⏱️ Spielzeit</div>
      <div class="stat-value" id="r-time">—</div>
    </div>
  </div>
  <button class="btn-start" onclick="reset()">🔄 Nochmal spielen</button>
</div>

<script>
  /* ── DURUM ── */
  let cfg = { op:'+', diff:'easy' };
  let sec=120, tInt=null, grid=[];
  let p = {
    1:{ans:'',q:null,ok:0},
    2:{ans:'',q:null,ok:0}
  };

  const ac = new (window.AudioContext||window.webkitAudioContext)();

  /* ── NAVİGASYON ── */
  function showS(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function selOp(op)   { cfg.op=op;    showS('s3'); }
  function selDiff(d)  { cfg.diff=d;   startGame(); }

  /* ── SES ── */
  function snd(type){
    if(ac.state==='suspended') ac.resume();
    const now=ac.currentTime;
    if(type==='ding'){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(660,now); o.frequency.exponentialRampToValueAtTime(880,now+.2);
      g.gain.setValueAtTime(.28,now); g.gain.linearRampToValueAtTime(0,now+.2);
      o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+.2);
    } else if(type==='buzz'){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(200,now); o.frequency.exponentialRampToValueAtTime(80,now+.25);
      g.gain.setValueAtTime(.28,now); g.gain.linearRampToValueAtTime(0,now+.25);
      o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+.25);
    } else if(type==='fanfare'){
      const m=ac.createGain(); m.gain.value=.42; m.connect(ac.destination);
      function fn(f,t,d,tp='triangle',v=.7){
        const o=ac.createOscillator(),g=ac.createGain();
        o.type=tp; o.frequency.value=f; o.connect(g); g.connect(m);
        const t0=now+t;
        g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.02);
        g.gain.setValueAtTime(v*.75,t0+d*.65); g.gain.linearRampToValueAtTime(0,t0+d);
        o.start(t0); o.stop(t0+d+.08);
      }
      fn(523,.00,.10);fn(659,.09,.10);fn(784,.18,.10);fn(1047,.27,.35);
      fn(784,.65,.12);fn(880,.77,.12);fn(1047,.89,.50);
      fn(1319,1.42,.09);fn(1175,1.51,.09);fn(1047,1.60,.09);fn(880,1.69,.09);fn(1047,1.78,.80);
      fn(261,.00,.40,'sine',.28);fn(392,.65,.78,'sine',.26);fn(523,1.78,.80,'sine',.28);
    }
  }

  /* ── SORU ÜRETİMİ ── */
  function genQ(){
    let op=cfg.op==='mix'?['+','-','*','/'][Math.floor(Math.random()*4)]:cfg.op;
    const d=cfg.diff;
    let n1,n2,ans,ok=false;
    while(!ok){
      if(op==='+'){
        if(d==='easy'){
          n1=Math.floor(Math.random()*14)+1;
          n2=Math.floor(Math.random()*(19-n1))+1;
          if((n1%10)+(n2%10)<10 && n1+n2<=20) ok=true;
        } else if(d==='medium'){
          // Bir sayı tam onluk (20,30,...,80), diğeri 1-9 arası
          const zehner=[20,30,40,50,60,70,80];
          if(Math.random()<.5){
            n1=zehner[Math.floor(Math.random()*zehner.length)];
            n2=Math.floor(Math.random()*9)+1;
          } else {
            n2=zehner[Math.floor(Math.random()*zehner.length)];
            n1=Math.floor(Math.random()*9)+1;
          }
          if(n1+n2<=99) ok=true;
        } else {
          n1=Math.floor(Math.random()*60)+10;
          n2=Math.floor(Math.random()*60)+10;
          if(n1+n2<=100) ok=true;
        }
        ans=n1+n2;
      } else if(op==='-'){
        if(d==='easy'){
          n1=Math.floor(Math.random()*18)+2;
          n2=Math.floor(Math.random()*(n1-1))+1;
          if((n1%10)>=(n2%10)) ok=true;
        } else if(d==='medium'){
          // Bir sayı tam onluk, çıkarma için Zehnerübergang yok
          const zehner=[20,30,40,50,60,70,80,90];
          n1=zehner[Math.floor(Math.random()*zehner.length)];
          n2=Math.floor(Math.random()*9)+1;
          ok=true; // n1 tam onluk, n2 tek basamak → her zaman geçerli
        } else {
          n1=Math.floor(Math.random()*88)+12;
          n2=Math.floor(Math.random()*(n1-1))+1;
          ok=true;
        }
        ans=n1-n2;
      } else if(op==='*'){
        n1=Math.floor(Math.random()*(d==='easy'?5:10))+1;
        n2=Math.floor(Math.random()*(d==='easy'?4:10))+1;
        ans=n1*n2; if(ans<=100) ok=true;
      } else {
        n2=Math.floor(Math.random()*9)+2;
        ans=Math.floor(Math.random()*(d==='easy'?5:10))+1;
        n1=n2*ans; if(n1<=100) ok=true;
      }
    }
    const sym=op==='*'?'×':op==='/'?'÷':op;
    return {text:`${n1} ${sym} ${n2} = ?`, answer:ans};
  }

  /* ── OYUNU BAŞLAT ── */
  function startGame(){
    sec=120;
    grid=[...Array(10).fill(1),...Array(10).fill(2)];
    p[1]={ans:'',q:null,ok:0};
    p[2]={ans:'',q:null,ok:0};
    initGrid(); updHeader(); nextQ(1); nextQ(2);
    const td=document.getElementById('timer');
    td.className='timer-display'; td.innerText='2:00';
    if(tInt) clearInterval(tInt);
    tInt=setInterval(tick,1000);
    showS('game-screen');
  }

  function initGrid(){
    const c=document.getElementById('grid'); c.innerHTML='';
    grid.forEach((o,i)=>{
      const sq=document.createElement('div');
      sq.className=`square ${o===1?'p1':'p2'}`; sq.id=`sq${i}`;
      c.appendChild(sq);
    });
  }

  function tick(){
    sec--;
    const m=Math.floor(sec/60),s=sec%60;
    const td=document.getElementById('timer');
    td.innerText=`${m}:${s<10?'0':''}${s}`;
    td.className=sec<=10?'timer-display t-danger':sec<=30?'timer-display t-warn':'timer-display';
    if(sec<=0) endGame();
  }

  function updHeader(){
    const c1=grid.filter(v=>v===1).length;
    document.getElementById('p1-cnt').innerText=c1;
    document.getElementById('p2-cnt').innerText=20-c1;
  }

  function nextQ(n){
    p[n].q=genQ(); p[n].ans='';
    document.getElementById(`q${n}`).innerText=p[n].q.text;
    const a=document.getElementById(`a${n}`);
    a.innerText='_'; a.classList.add('empty');
  }

  function key(n,k){
    const pl=p[n], d=document.getElementById(`a${n}`);
    if(k==='back')     { pl.ans=pl.ans.slice(0,-1); }
    else if(k==='ok')  { if(pl.ans!=='') check(n); return; }
    else               { if(pl.ans.length<3) pl.ans+=k; }
    if(pl.ans==='') { d.innerText='_'; d.classList.add('empty'); }
    else            { d.innerText=pl.ans; d.classList.remove('empty'); }
  }

  function check(n){
    const pl=p[n], opp=n===1?2:1;
    if(parseInt(pl.ans,10)===pl.q.answer){
      snd('ding'); pl.ok++;
      flash(n,'correct'); capture(n,opp);
    } else {
      snd('buzz');
      flash(n,'wrong'); capture(opp,n);
    }
    updHeader();
    const c1=grid.filter(v=>v===1).length;
    if(c1===20||c1===0){ endGame(); return; }
    nextQ(n);
  }

  function capture(win,lose){
    const pool=grid.reduce((a,v,i)=>{if(v===lose)a.push(i);return a;},[]);
    if(!pool.length) return;
    const idx=pool[Math.floor(Math.random()*pool.length)];
    grid[idx]=win;
    const sq=document.getElementById(`sq${idx}`);
    sq.className=`square ${win===1?'p1':'p2'} captured`;
    setTimeout(()=>sq.classList.remove('captured'),450);
  }

  function flash(n,type){
    const el=document.getElementById(`fl${n}`);
    el.className='flash-overlay'; void el.offsetWidth;
    el.className=`flash-overlay ${type}`;
  }

  function endGame(){
    if(tInt) clearInterval(tInt);
    const c1=grid.filter(v=>v===1).length, c2=20-c1;
    const el=120-sec, em=Math.floor(el/60), es=el%60;
    const wt=document.getElementById('winner');
    if(c1>c2)      { wt.innerHTML='🦖 Spieler 1 gewinnt!'; wt.style.color='var(--p1)'; }
    else if(c2>c1) { wt.innerHTML='🦕 Spieler 2 gewinnt!'; wt.style.color='var(--p2)'; }
    else           { wt.innerHTML='🤝 Unentschieden!';      wt.style.color='var(--yellow)'; }
    document.getElementById('r-sq').innerText   =`${c1} : ${c2}`;
    document.getElementById('r-cor').innerText  =`${p[1].ok} : ${p[2].ok}`;
    document.getElementById('r-time').innerText =`${em}:${es<10?'0':''}${es}`;
    snd('fanfare'); spawnConfetti(); showS('result-screen');
  }

  function spawnConfetti(){
    document.querySelectorAll('.confetti').forEach(c=>c.remove());
    const rs=document.getElementById('result-screen');
    ['#FF6B9D','#00C9A7','#FFD93D','#fff','#BB86FC'].forEach(col=>{
      for(let i=0;i<12;i++){
        const c=document.createElement('div');
        c.className='confetti';
        c.style.left=`${Math.random()*100}%`;
        c.style.backgroundColor=col;
        c.style.animationDuration=`${2+Math.random()*2}s`;
        c.style.animationDelay=`${Math.random()*1.5}s`;
        rs.appendChild(c);
      }
    });
  }

  function reset(){
    document.querySelectorAll('.confetti').forEach(c=>c.remove());
    showS('s1');
  }
</script>
</body>
</html>
