<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitim Portalı - Ana Menü</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .portal-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 4px solid rgba(255, 255, 255, 0.2);
            width: 90%;
            max-width: 1000px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 30px;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .game-card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            text-decoration: none;
            color: #333;
            font-size: 2rem;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 0 #ddd;
            border: 6px solid transparent;
        }

        /* Her Oyun İçin Ayrı Renk */
        .toplama { border-color: #FF5252; color: #D32F2F; }
        .cikarma { border-color: #2196F3; color: #1976D2; }
        .carpma { border-color: #4CAF50; color: #388E3C; }
        .bolme { border-color: #9C27B0; color: #7B1FA2; }

        .game-card:active {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #bbb;
        }

        .game-card span {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .game-card:hover {
            transform: scale(1.05);
            background: #f9f9f9;
        }

        p { font-size: 1.5rem; margin-top: 20px; opacity: 0.8; }
    </style>
</head>
<body>

<div class="portal-container">
    <h1>🚀 EĞİTİCİ OYUNLAR</h1>
    <div class="game-grid">
        <a href="toplama.html" class="game-card toplama">
            <span>➕</span> TOPLAMA YARIŞI
        </a>
        
        <a href="cikarma.html" class="game-card cikarma">
            <span>➖</span> ÇIKARMA YARIŞI
        </a>

        <a href="carpma.html" class="game-card carpma">
            <span>✖️</span> ÇARPMA YARIŞI
        </a>

        <a href="bolme.html" class="game-card bolme">
            <span>➗</span> BÖLME YARIŞI
        </a>
    </div>
    <p>Oynamak istediğin dersi seç ve yarışa başla!</p>
</div>

</body>
</html>
